# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  main:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # For test_tensorflow_utils to run
        pip install tensorflow
        # For test_pytorch_utils to run
        pip install torch --extra-index-url https://download.pytorch.org/whl/cpu


    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run pytest and generate coverage report
      run: |
        export NUMBA_DISABLE_JIT=1
        pytest --cov=./ --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests

  notebooks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install pycomlink itself so it is importable from the notebook
        # working directory (docs/notebooks)
        pip install -e .
        # Notebook execution dependencies
        pip install nbmake
        # For the "Use pytorch models" notebook to run
        pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
    - name: Execute documentation notebooks
      run: |
        # Execute a curated subset of the documentation notebooks via
        # pytest --nbmake. Excluded notebooks:
        #   - "Blackout gap detection examples.ipynb": downloads data from Zenodo
        #     at runtime (network dependency, not reliable in CI).
        #   - "Use tensorflow models.ipynb": requires TensorFlow, which is not
        #     installed in this job.
        #   - "Wet-dry classification methods.ipynb": loads pickled MLP models that
        #     are incompatible with the numpy version installed by requirements.txt.
        # --nbmake-kernel=python3: the notebooks declare a "pycomlink-dev"
        # kernelspec, which does not exist in CI. Use the standard python3 kernel.
        python -m pytest --nbmake --nbmake-kernel=python3 \
          "docs/notebooks/Basic CML processing workflow.ipynb" \
          "docs/notebooks/Compare interpolation methods.ipynb" \
          "docs/notebooks/Get radar rainfall along CML paths.ipynb" \
          "docs/notebooks/Nearby link approach processing example.ipynb" \
          "docs/notebooks/Use pytorch models.ipynb" \
          "docs/notebooks/Wet antenna attenuation.ipynb"


